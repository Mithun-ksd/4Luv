<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="This 4Luv birthday wish could not be found."
    />

    <meta name="robots" content="noindex, nofollow" />

    <title>Wish Not Found — 4Luv</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/404.css" />
  </head>

  <body>
    <!-- Wish Not Found Page -->

    <main class="error-page">
      <!-- Error Card -->

      <section class="error-card">
        <!-- Decorative Birthday Icon -->

        <div class="error-icon" aria-hidden="true">🎂</div>

        <!-- Error Label -->

        <p class="error-label">Oops!</p>

        <!-- Main Error Heading -->

        <h1>This birthday wish is missing.</h1>

        <!-- Error Description -->

        <p class="error-description">
          We couldn't find the birthday wish you're looking for. The link may be
          incorrect or the wish may no longer exist.
        </p>

        <!-- Main Action -->

        <a href="index.html" class="error-button"> 🏠 Go to 4Luv </a>

        <!-- Secondary Action -->

        <a href="create.html" class="create-link">
          Create a birthday wish instead →
        </a>

        <!-- Brand -->

        <p class="error-brand">Made with <strong>4Luv</strong> ❤️</p>
      </section>
    </main>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
