<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Your 4Luv birthday wish is ready to share."
    />

    <meta name="robots" content="noindex, nofollow" />

    <title>Your Birthday Wish Is Ready — 4Luv</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/success.css" />
  </head>

  <body>
    <!-- Success Page -->
    <main class="success-page">
      <!-- Success Card -->
      <section class="success-card">
        <!-- Celebration Icon -->
        <div class="success-icon" aria-hidden="true">🎉</div>

        <!-- Main Heading -->
        <p class="success-label">Your surprise is ready!</p>

        <h1>Birthday wish created! ❤️</h1>

        <!-- Description -->
        <p class="success-description">
          Your personalized birthday wish is ready. Send the link to someone
          special and make their day a little brighter.
        </p>

        <!-- URL Section -->
        <div class="share-box">
          <!-- URL Label -->
          <span class="share-label"> Your personalized link </span>

          <!-- URL Input Area -->
          <div class="share-url">
            <input
              type="text"
              id="wishUrl"
              value=""
              readonly
              aria-label="Birthday wish URL"
            />

            <!-- Copy Button -->
            <button type="button" id="copyButton" class="copy-button">
              Copy
            </button>
          </div>

          <!-- Copy Status -->
          <p id="copyStatus" class="copy-status" aria-live="polite"></p>
        </div>

        <!-- Main Actions -->
        <div class="success-actions">
          <button type="button" id="shareButton" class="primary-button">
            💌 Share Wish
          </button>

          <button type="button" id="viewButton" class="secondary-button">
            🎂 View Birthday Wish
          </button>
        </div>

        <!-- Create Another Wish -->
        <a href="create.html" class="create-another"> Create another wish </a>

        <!-- Brand Footer -->
        <p class="success-brand">Made with <strong>4Luv</strong> ❤️</p>
      </section>
    </main>

    <!-- Success Page JavaScript -->
    <script src="js/success.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
